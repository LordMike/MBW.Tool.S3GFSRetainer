name: Test S3 GFS Retainer
description: Install the repository's Python dependencies and run its test suite

# Contract:
# - The managed CI workflow calls this action exactly once.
# - Python stays on the repository's explicitly supported runtime line.
# - The action tests the source and produces no publishing artifacts.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      shell: bash
      run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt

    - name: Run tests
      shell: bash
      run: python -m pytest
